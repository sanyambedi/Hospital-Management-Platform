# =============================================================================
# Hospital Appointment API – CI/CD Pipeline
#
# Triggers: push (all branches), pull_request, tags v*.*.*
# Jobs: secret-scan → lint → test → build-scan-push → smoke
# =============================================================================
name: CI/CD

on:
  push:
    branches: ["**"]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:  # WHY: manual trigger for demos

# WHY minimal permissions: principle of least privilege
permissions:
  contents: read

# WHY concurrency: cancel superseded runs on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Secret scan — runs first, in parallel with lint
  # WHY: catches accidentally committed secrets before they reach main
  # ---------------------------------------------------------------------------
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for gitleaks
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # Lint: ruff + pip-audit
  # ---------------------------------------------------------------------------
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt
      - name: Ruff check
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: pip-audit (security)
        run: pip-audit -r requirements.txt
        continue-on-error: true  # Document any accepted exceptions

  # ---------------------------------------------------------------------------
  # Test: pytest with real Postgres
  # ---------------------------------------------------------------------------
  test:
    needs: lint
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: hospital_test
          POSTGRES_USER: hospital
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hospital -d hospital_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://hospital:testpassword@localhost:5432/hospital_test
      JWT_SECRET: ci-test-jwt-secret
      SEED_PASSWORD: ci-test-seed-password
      APP_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run migrations
        run: alembic upgrade head
      - name: Run tests with coverage
        run: pytest tests/ --cov=app --cov-report=xml --cov-report=term-missing --junitxml=report.xml -v
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: report.xml

  # ---------------------------------------------------------------------------
  # Build, scan, and push image to GHCR
  # ---------------------------------------------------------------------------
  build-scan-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write  # WHY: needed for cosign keyless signing
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - name: Set image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ github.ref_name }}
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: true

      - name: Print image digest
        run: |
          echo "### Docker Image" >> $GITHUB_STEP_SUMMARY
          echo "Digest: \`${{ steps.build.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY
          echo "Tags: ${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY

      - name: Save digest artifact
        run: echo "${{ steps.build.outputs.digest }}" > image-digest.txt
      - uses: actions/upload-artifact@v4
        with:
          name: image-digest
          path: image-digest.txt

      # Trivy image scan
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          format: sarif
          output: trivy-image.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
        if: github.event_name != 'pull_request'
        continue-on-error: true

      - name: Upload Trivy SARIF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-image-report
          path: trivy-image.sarif
        continue-on-error: true

      # Trivy filesystem/config scan
      - name: Trivy config scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          format: table
          severity: HIGH,CRITICAL
        continue-on-error: true

      # Cosign signing
      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v3

      - name: Sign image with cosign
        if: github.event_name != 'pull_request'
        run: |
          cosign sign --yes ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
        env:
          COSIGN_EXPERIMENTAL: "true"

      - name: Verify cosign signature
        if: github.event_name != 'pull_request'
        run: |
          cosign verify \
            --certificate-identity-regexp="https://github.com/sanyambedi/Hospital-Management-Platform/.github/workflows/ci.yml@.*" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
        env:
          COSIGN_EXPERIMENTAL: "true"

  # ---------------------------------------------------------------------------
  # Smoke test: docker compose with the built image
  # ---------------------------------------------------------------------------
  smoke:
    needs: build-scan-push
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Create secrets
        run: |
          mkdir -p secrets
          openssl rand -base64 32 > secrets/db_password.txt
          openssl rand -base64 32 > secrets/jwt_secret.txt
          echo "smoketest123" > secrets/seed_password.txt

      - name: Start stack
        run: |
          export APP_IMAGE=${IMAGE_NAME}:sha-${{ github.sha }}
          export RUN_SEED=true
          docker compose -f deploy/docker-compose.yml up -d
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        timeout-minutes: 5

      - name: Wait for healthy
        run: |
          for i in $(seq 1 30); do
            STATUS=$(curl -ks https://localhost/healthz | jq -r .status || true)
            if [ "$STATUS" = "ok" ]; then
              echo "Stack is healthy!"
              break
            fi
            echo "Waiting for stack... ($i/30)"
            sleep 2
          done

      - name: Seed data
        run: |
          docker compose -f deploy/docker-compose.yml exec -T app python -m app.seed
        continue-on-error: true

      - name: Run smoke test
        run: |
          export SEED_PASSWORD=$(cat secrets/seed_password.txt)
          bash scripts/smoke_test.sh

      # --- Step 3 Real Evidence Generation ---
      - name: Generate deployment health evidence
        run: |
          mkdir -p docs/evidence
          echo "=== Docker Compose PS ===" > docs/evidence/deployment-health.txt
          docker compose -f deploy/docker-compose.yml ps >> docs/evidence/deployment-health.txt
          echo "" >> docs/evidence/deployment-health.txt
          echo "=== Image Digest ===" >> docs/evidence/deployment-health.txt
          echo "${{ needs.build-scan-push.outputs.digest }}" >> docs/evidence/deployment-health.txt
          echo "" >> docs/evidence/deployment-health.txt
          echo "=== HTTPS Probes ===" >> docs/evidence/deployment-health.txt
          echo "/healthz: $(curl -ks https://localhost/healthz)" >> docs/evidence/deployment-health.txt
          echo "/readyz: $(curl -ks https://localhost/readyz)" >> docs/evidence/deployment-health.txt
          echo "" >> docs/evidence/deployment-health.txt
          echo "=== Security: Container Non-Root User ===" >> docs/evidence/deployment-health.txt
          docker compose -f deploy/docker-compose.yml exec -T app id >> docs/evidence/deployment-health.txt
          echo "" >> docs/evidence/deployment-health.txt
          echo "=== Security: Published Ports (Only Caddy 80/443 on host) ===" >> docs/evidence/deployment-health.txt
          docker compose -f deploy/docker-compose.yml port app 8000 2>&1 || echo "App port 8000 is internal-only (not published)" >> docs/evidence/deployment-health.txt
          docker compose -f deploy/docker-compose.yml port db 5432 2>&1 || echo "DB port 5432 is internal-only (not published)" >> docs/evidence/deployment-health.txt

      - name: Run concurrency proof
        run: |
          export SEED_PASSWORD=$(cat secrets/seed_password.txt)
          python3 scripts/concurrency_proof.py

      - name: Run backup restore drill
        run: |
          bash scripts/drill_backup_restore.sh

      - name: Run failure recovery drill
        run: |
          bash scripts/drill_failure.sh

      - name: Run rollback demo
        run: |
          echo "$(date -u +%Y-%m-%dT%H:%M:%SZ)|sha-${{ github.sha }}" > .deployed_tags
          bash scripts/deploy.sh broken-invalid-tag-demo || true
          bash scripts/rollback.sh 2>&1 | tee docs/evidence/rollback.log

      - name: Upload evidence artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drill-evidence-logs
          path: docs/evidence/

      - name: Dump logs on failure
        if: failure()
        run: docker compose -f deploy/docker-compose.yml logs

      - name: Cleanup
        if: always()
        run: docker compose -f deploy/docker-compose.yml down -v
