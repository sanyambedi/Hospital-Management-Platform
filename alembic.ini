# Alembic configuration file.
# WHY: manages database schema migrations so deployments are repeatable
# and schema changes are versioned alongside code.

[alembic]
# Path to migration scripts
script_location = migrations

# WHY placeholder: the actual URL comes from app.config via env.py
# This avoids committing a real connection string.
sqlalchemy.url = postgresql+psycopg://placeholder:placeholder@localhost/placeholder

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
